:root {
  --ink: #0e0f13; --ink-2: #1a1d26; --text: #1b1e27; --muted: #667085; --line: #e6e8ee; --bg: #f5f6f8; --card: #fff;
  --brand: #ff5a1f; --brand-d: #e24a10; --brand-soft: #fff0e9; --green: #0b8a4a; --green-soft: #e6f6ee; --red: #d92d20; --red-soft: #fdecea; --amber: #b54708; --amber-soft: #fff4e5; --star: #f5a623;
  --r: 16px; --r-sm: 10px; --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 14px rgba(16, 24, 40, .06); --shadow-lg: 0 12px 40px rgba(16, 24, 40, .18);
  --header-h: 112px; --bottom-h: 62px; --wrap: 1240px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; font-family: var(--font); color: var(--text); background: var(--bg); line-height: 1.45; font-size: 15px; padding-bottom: calc(var(--bottom-h) + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { line-height: 1.2; margin: 0; letter-spacing: -.01em; }
:focus-visible { outline: 3px solid #1a73e8; outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: #fff; padding: 10px 14px; border-radius: 8px; z-index: 999; }
.skip:focus { left: 8px; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 14px; }
.muted { color: var(--muted); }
.hide { display: none !important; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- header ---------- */
.announce { background: var(--ink); color: #fff; text-align: center; font-size: 13px; padding: 7px 12px; }
.demo-bar { background: var(--amber-soft); color: var(--amber); text-align: center; font-size: 12.5px; padding: 6px 12px; border-bottom: 1px solid #f7d9b0; }
.site-header { position: sticky; top: 0; z-index: 50; background: #fff; box-shadow: 0 1px 0 var(--line); }
.hdr-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0 10px; min-height: 58px; }
.logo { display: flex; align-items: center; gap: 9px; flex: none; }
.logo img { width: 36px; height: 36px; border-radius: 10px; }
.logo b { display: block; font-weight: 900; font-style: italic; font-size: 20px; letter-spacing: .04em; line-height: 1; color: var(--ink); }
.logo small { display: block; font-size: 8.5px; letter-spacing: .34em; font-weight: 700; color: var(--brand); margin-top: 3px; }
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; color: var(--ink); }
.icon-btn:hover { background: var(--bg); }
.badge { position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.hdr-spacer { flex: 1; }
.hdr-search { order: 5; flex: 1 0 100%; padding-bottom: 10px; position: relative; }
.search-box { display: flex; align-items: center; background: var(--bg); border: 1.5px solid transparent; border-radius: 14px; height: 44px; padding: 0 6px 0 14px; gap: 8px; }
.search-box:focus-within { border-color: var(--brand); background: #fff; }
.search-box input { flex: 1; border: 0; background: transparent; outline: 0; height: 100%; min-width: 0; font-size: 16px; }
.search-box button { border: 0; background: var(--brand); color: #fff; width: 36px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.suggest { position: absolute; left: 0; right: 0; top: 48px; background: #fff; border-radius: 14px; box-shadow: var(--shadow-lg); z-index: 60; overflow: hidden; border: 1px solid var(--line); max-height: 70vh; overflow-y: auto; }
.suggest a { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.suggest a:hover, .suggest a[aria-selected="true"] { background: var(--bg); }
.suggest img { width: 38px; height: 38px; object-fit: contain; }
.suggest .sg-h { padding: 8px 14px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.nav-main { display: none; border-top: 1px solid var(--line); }
.nav-main .wrap { display: flex; gap: 4px; }
.nav-main a { padding: 11px 14px; font-weight: 600; font-size: 14px; border-bottom: 3px solid transparent; color: var(--ink-2); }
.nav-main a:hover { color: var(--brand); }
.nav-main a.on { color: var(--brand); border-color: var(--brand); }
.hide-mobile { display: none; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(14, 15, 19, .5); z-index: 90; opacity: 0; transition: opacity .2s; }
.scrim.show { opacity: 1; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(86vw, 340px); background: #fff; z-index: 100; transform: translateX(-102%); transition: transform .22s ease; overflow-y: auto; padding: 14px 0 30px; }
.drawer.open { transform: none; }
.drawer a, .drawer .dr-link { display: flex; align-items: center; gap: 12px; padding: 13px 20px; font-weight: 600; }
.drawer a:hover { background: var(--bg); }
.drawer .dr-sub a { padding: 9px 20px 9px 52px; font-weight: 500; color: var(--muted); font-size: 14px; }
.drawer hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }

/* bottom nav */
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 55; background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); height: calc(var(--bottom-h) + env(safe-area-inset-bottom)); }
.bottom-nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); position: relative; }
.bottom-nav a.on { color: var(--brand); }
.bottom-nav .badge { top: 5px; right: calc(50% - 22px); }

/* ---------- buttons & forms ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 13px; border: 1.5px solid transparent; font-weight: 700; font-size: 15px; background: var(--ink); color: #fff; white-space: nowrap; transition: transform .06s, background .15s; }
.btn:active { transform: scale(.98); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn-brand { background: var(--brand); } .btn-brand:hover:not(:disabled) { background: var(--brand-d); }
.btn-ghost { background: #fff; color: var(--ink); border-color: var(--line); } .btn-ghost:hover:not(:disabled) { border-color: var(--ink); }
.btn-outline { background: transparent; color: var(--brand); border-color: var(--brand); }
.btn-light { background: #fff; color: var(--ink); }
.btn-danger { background: #fff; color: var(--red); border-color: #f4c7c3; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 11px; }
.btn-block { width: 100%; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-weight: 600; font-size: 13.5px; }
.input, select.input, textarea.input { width: 100%; min-height: 46px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 16px; }
textarea.input { min-height: 110px; resize: vertical; }
.input:focus { border-color: var(--brand); outline: 0; box-shadow: 0 0 0 3px rgba(255, 90, 31, .15); }
.input[aria-invalid="true"] { border-color: var(--red); }
.hint { font-size: 12.5px; color: var(--muted); }
.err { color: var(--red); font-size: 13px; }
.form-error { background: var(--red-soft); color: var(--red); border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; font-size: 14px; }
.form-ok { background: var(--green-soft); color: var(--green); border-radius: 12px; padding: 11px 14px; margin-bottom: 14px; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 0 14px; }
.chk { display: flex; align-items: center; gap: 10px; min-height: 36px; cursor: pointer; }
.chk input { width: 20px; height: 20px; accent-color: var(--brand); }

/* ---------- cards & product grid ---------- */
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 16px; }
.section { margin: 22px 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sec-head h2 { font-size: 20px; font-weight: 800; }
.sec-head a { color: var(--brand); font-weight: 700; font-size: 14px; }
.pgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.hscroll { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; padding: 2px 14px 14px; margin: 0 -14px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { flex: 0 0 min(46vw, 210px); scroll-snap-align: start; }
.pcard { position: relative; display: flex; flex-direction: column; background: #fff; border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.pcard .pimg { display: block; aspect-ratio: 1 / 1; background: linear-gradient(180deg, #f7f8fa, #eef0f4); padding: 12px; }
.pcard .pimg img { width: 100%; height: 100%; object-fit: contain; }
.pcard .pbody { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.pcard .brand { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.pcard h3 { font-size: 14.5px; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.4em; }
.pcard .var { font-size: 12.5px; color: var(--muted); }
.price-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 8px; margin-top: 2px; }
.price { font-size: 18px; font-weight: 800; color: var(--ink); }
.mrp { font-size: 13px; color: var(--muted); text-decoration: line-through; }
.off { font-size: 13px; font-weight: 800; color: var(--green); }
.stock { font-size: 12px; font-weight: 700; }
.stock.in { color: var(--green); } .stock.low { color: var(--amber); } .stock.out { color: var(--red); }
.rating { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; }
.rating .chip { background: var(--green); color: #fff; border-radius: 6px; padding: 1px 6px; display: inline-flex; align-items: center; gap: 2px; }
.rating .chip svg { width: 11px; height: 11px; fill: #fff; stroke: none; }
.pcard .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.pcard .actions .btn { min-height: 40px; padding: 0 6px; font-size: 13px; border-radius: 10px; }
.heart { position: absolute; top: 8px; right: 8px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .95); display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0, 0, 0, .15); z-index: 2; }
.heart svg { width: 20px; height: 20px; }
.heart[aria-pressed="true"] svg { fill: var(--red); stroke: var(--red); }
.tag { position: absolute; top: 8px; left: 8px; z-index: 2; background: var(--brand); color: #fff; font-size: 11.5px; font-weight: 800; padding: 3px 8px; border-radius: 8px; }
.tag.demo { background: var(--amber-soft); color: var(--amber); top: auto; bottom: 8px; left: 8px; font-size: 10.5px; border: 1px solid #f7d9b0; }
.pcard.oos .pimg img { opacity: .5; filter: grayscale(.6); }

/* ---------- hero & category cards ---------- */
.hero { position: relative; overflow: hidden; border-radius: 22px; margin-top: 14px; color: #fff; background: radial-gradient(1200px 400px at 85% 10%, rgba(255, 90, 31, .55), transparent 60%), linear-gradient(135deg, #0e0f13 0%, #1c1f2b 60%, #2a1a14 100%); display: grid; grid-template-columns: 1fr; }
.hero-copy { padding: 26px 20px 8px; position: relative; z-index: 2; }
.hero .eyebrow { display: inline-block; font-size: 11.5px; letter-spacing: .16em; font-weight: 800; color: #ffb494; margin-bottom: 10px; }
.hero h1 { font-size: clamp(29px, 7vw, 54px); font-weight: 900; letter-spacing: -.02em; max-width: 14ch; }
.hero h1 em { font-style: normal; color: var(--brand); }
.hero p { color: #cfd3dd; margin: 12px 0 18px; max-width: 38ch; font-size: 16px; }
.hero .btns { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-art { position: relative; height: 230px; margin-top: -4px; }
.hero-art img { position: absolute; height: 100%; width: auto; left: 50%; top: 0; transform: translateX(-50%); filter: drop-shadow(0 18px 24px rgba(0, 0, 0, .45)); }
.trust { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.trust > div { background: #fff; border-radius: 14px; padding: 12px; display: flex; gap: 10px; align-items: center; font-size: 13px; box-shadow: var(--shadow); }
.trust svg { color: var(--brand); }
.cat-cards { display: grid; gap: 12px; }
.cat-card { background: #fff; border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; position: relative; overflow: hidden; }
.cat-card h3 { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.cat-card .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chipl { display: inline-flex; align-items: center; min-height: 36px; padding: 0 13px; border-radius: 999px; background: var(--bg); font-size: 13.5px; font-weight: 600; border: 1px solid var(--line); }
.chipl:hover { border-color: var(--brand); color: var(--brand); }
.chipl small { color: var(--muted); margin-left: 6px; font-weight: 500; }
.cat-card .all { position: absolute; top: 16px; right: 16px; color: var(--brand); font-weight: 700; font-size: 13.5px; }

/* ---------- listing ---------- */
.crumbs { font-size: 13px; color: var(--muted); padding: 14px 0 4px; display: flex; flex-wrap: wrap; gap: 6px; }
.crumbs a:hover { color: var(--brand); }
.list-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0 12px; }
.list-head h1 { font-size: 22px; font-weight: 800; }
.toolbar { display: flex; gap: 8px; align-items: center; }
.toolbar select { min-height: 42px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; padding: 0 10px; font-size: 14px; }
.active-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; background: var(--brand-soft); color: var(--brand-d); border: 0; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.layout-list { display: block; }
.filters { background: #fff; border-radius: var(--r); box-shadow: var(--shadow); padding: 6px 16px 16px; }
.filters h3 { font-size: 14px; margin: 16px 0 8px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.pill-set { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; gap: 7px; }
.pill[aria-pressed="true"], .pill.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-d); }
.pill:disabled, .pill.dis { opacity: .4; text-decoration: line-through; }
.swatch { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .2); display: inline-block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; background: var(--bg); border-radius: 22px 22px 0 0; max-height: 88vh; overflow-y: auto; transform: translateY(104%); transition: transform .24s ease; padding: 0 14px calc(90px + env(safe-area-inset-bottom)); }
.sheet.open { transform: none; }
.sheet-head { position: sticky; top: 0; background: var(--bg); padding: 16px 0 10px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
.sheet-foot { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr 2fr; gap: 10px; border-top: 1px solid var(--line); z-index: 3; }
.price-inputs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.empty { text-align: center; padding: 50px 20px; }
.empty .big { font-size: 44px; margin-bottom: 8px; }
.empty h2 { font-size: 19px; margin-bottom: 6px; }

/* ---------- product page ---------- */
.pdp { display: grid; gap: 16px; margin-top: 8px; }
.gallery { background: #fff; border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; }
.g-main { position: relative; aspect-ratio: 1/1; background: linear-gradient(180deg, #f7f8fa, #eef0f4); border-radius: 12px; overflow: hidden; cursor: zoom-in; display: grid; place-items: center; }
.g-main img { width: 100%; height: 100%; object-fit: contain; padding: 14px; transition: transform .18s; transform-origin: center; }
.g-thumbs { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; }
.g-thumbs button { flex: none; width: 64px; height: 64px; border: 2px solid var(--line); border-radius: 10px; background: #f7f8fa; padding: 4px; }
.g-thumbs button[aria-current="true"] { border-color: var(--brand); }
.g-thumbs img { width: 100%; height: 100%; object-fit: contain; }
.lightbox { position: fixed; inset: 0; background: rgba(14, 15, 19, .94); z-index: 200; display: grid; place-items: center; overflow: hidden; touch-action: none; }
.lightbox img { max-width: 94vw; max-height: 86vh; object-fit: contain; transition: transform .15s; cursor: zoom-in; }
.lightbox.zoomed img { cursor: zoom-out; }
.lightbox .x { position: absolute; top: 12px; right: 12px; background: #fff; border-radius: 50%; width: 44px; height: 44px; border: 0; display: grid; place-items: center; }
.lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, .9); border: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; }
.pinfo h1 { font-size: 22px; font-weight: 800; }
.pinfo .brandline { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); margin-bottom: 4px; }
.pinfo .price { font-size: 30px; }
.pinfo .mrp { font-size: 16px; } .pinfo .off { font-size: 16px; }
.opt-title { font-weight: 800; font-size: 14px; margin: 18px 0 8px; display: flex; gap: 8px; align-items: baseline; }
.opt-title span { font-weight: 500; color: var(--muted); }
.buybar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.buybar .wish { grid-column: 1 / -1; }
.info-box { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 14px; display: grid; gap: 10px; font-size: 14px; background: #fff; }
.info-box div { display: flex; gap: 10px; align-items: flex-start; }
.info-box svg { color: var(--brand); margin-top: 1px; }
.demo-note { background: var(--amber-soft); border: 1px solid #f7d9b0; color: var(--amber); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
.tabs-sec { margin-top: 18px; display: grid; gap: 14px; }
.tabs-sec section { background: #fff; border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.tabs-sec h2 { font-size: 18px; font-weight: 800; margin-bottom: 10px; }
.specs { width: 100%; border-collapse: collapse; font-size: 14px; }
.specs th, .specs td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.specs th { width: 38%; color: var(--muted); font-weight: 600; }
.prose { white-space: pre-line; }
details.faq { border-bottom: 1px solid var(--line); padding: 12px 0; }
details.faq summary { font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.faq summary::after { content: "+"; font-size: 20px; line-height: 1; color: var(--brand); }
details.faq[open] summary::after { content: "−"; }
details.faq p { margin: 8px 0 0; color: var(--muted); white-space: pre-line; }
.review { border-top: 1px solid var(--line); padding: 14px 0; }
.review h4 { margin: 6px 0 4px; }
.verified { font-size: 12px; color: var(--green); font-weight: 700; }
.dist { display: grid; gap: 6px; max-width: 360px; }

We collect the details you give us when you create an account or place an order (name, email, mobile number and delivery address) so we can fulfil your order and provide support.

Card, UPI and netbanking details are entered on our payment provider's secure page. We never see or store them.
